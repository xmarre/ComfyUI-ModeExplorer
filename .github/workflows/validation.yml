name: Validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: Comfy-Org/ComfyUI
          ref: c8abeb00ad2736b649ca2fceb8395e25072c7ea3
          path: .comfyui
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r .comfyui/requirements.txt pytest
      - name: Test native Krea 2 integration
        env:
          PYTHONPATH: "${{ github.workspace }}/.comfyui:${{ github.workspace }}"
        run: python -m pytest -q tests
  spectrum-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: Comfy-Org/ComfyUI
          ref: 7ad7adb38f6cbb6c2b0713d3bd44c3fb2b9c8ebe
          path: .comfyui
      - uses: actions/checkout@v6
        with:
          repository: xmarre/ComfyUI-Spectrum-Krea2
          ref: 408a6eb37fcfa23f2ae566789a4bf34410db05d4
          path: .spectrum
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r .comfyui/requirements.txt pytest
      - name: Exercise joint ModelPatcher and forecast-history contracts
        env:
          PYTHONPATH: "${{ github.workspace }}/.comfyui:${{ github.workspace }}/.spectrum:${{ github.workspace }}"
        run: python -m pytest -q tests/test_spectrum_integration.py

